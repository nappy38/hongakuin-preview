<base href="/hongakuin-preview/">
<style>
:root{--washi:#f3ece1;--sumi:#2b2621;--ink:#150c15;--gold:#917c50;--gold-d:#6f5d36;--gold-l:#c9b183;--shu:#9a1117;--text-2:#4a4038;--line:rgba(43,38,33,.16);
  --mincho:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;--latin:'Cormorant Garamond',serif;--ease:cubic-bezier(.22,.61,.36,1);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--mincho);color:var(--sumi);background:var(--washi) url("images/tex-paper.webp");background-image:url("images/tex-fiber.webp"),url("images/tex-paper.webp");
  display:grid;grid-template-rows:1fr auto;min-height:100svh;letter-spacing:.04em;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
main{display:grid;place-items:center;padding:56px 20px;text-align:center;}
.box{max-width:560px;}
.mon{width:56px;height:56px;margin:0 auto 28px;opacity:.9;}
.num{font-family:var(--latin);font-size:15px;letter-spacing:.5em;color:var(--gold-d);}
h1{font-weight:400;font-size:30px;letter-spacing:.2em;line-height:1.6;margin:10px 0 0;}
.line{width:40px;height:1px;background:var(--gold);margin:28px auto;}
.lead{font-size:16px;line-height:2.1;color:var(--text-2);}
.en{font-family:var(--latin);font-style:italic;font-size:17px;color:var(--text-2);margin-top:10px;}
.links{list-style:none;margin:40px auto 0;max-width:360px;border-top:1px solid var(--sumi);}
.links li{border-bottom:1px solid var(--line);}
.links a{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:0 6px;font-size:17px;letter-spacing:.12em;transition:color .3s,padding .5s var(--ease);}
.links a::after{content:'';width:22px;height:1px;background:var(--gold);flex:none;transition:width .4s var(--ease);}
.links a:hover{color:var(--gold-d);padding-left:12px;}
.links a:hover::after{width:34px;}
